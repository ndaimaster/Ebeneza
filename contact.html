<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Ebeneza Foundation</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}h1{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen p-6">
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow p-8 mt-10">
  <h1 class="text-2xl font-bold text-[#0F5B66] mb-2">Contact Ebeneza Foundation</h1>
  <p class="text-gray-500 text-sm mb-6">P.O. Box 12597, Arusha, Tanzania · ebenezafoundation2025@gmail.com · +255 753 411 688</p>
  <form id="contactForm" class="space-y-4">
    <input name="name" required placeholder="Your name" class="w-full border rounded-xl px-4 py-3">
    <input name="email" type="email" required placeholder="Your email" class="w-full border rounded-xl px-4 py-3">
    <input name="phone" placeholder="Phone (optional)" class="w-full border rounded-xl px-4 py-3">
    <input name="subject" placeholder="Subject" class="w-full border rounded-xl px-4 py-3">
    <textarea name="message" required rows="5" placeholder="Your message" class="w-full border rounded-xl px-4 py-3"></textarea>
    <p id="contactError" class="hidden text-red-600 text-sm"></p>
    <p id="contactOk" class="hidden text-green-600 text-sm"></p>
    <button class="bg-[#F4B942] font-bold px-8 py-3 rounded-xl">Send Message</button>
  </form>
  <a href="index.html" class="text-[#0F5B66] underline text-sm block mt-6">Back to home</a>
</div>
<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('api/contact.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(e.target)))});
    const data = await res.json();
    const ok = document.getElementById('contactOk'), err = document.getElementById('contactError');
    ok.classList.add('hidden'); err.classList.add('hidden');
    if (res.ok) { ok.textContent = data.message; ok.classList.remove('hidden'); e.target.reset(); }
    else { err.textContent = data.error || 'Failed to send.'; err.classList.remove('hidden'); }
});
</script>
</body></html>
